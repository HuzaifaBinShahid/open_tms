services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opentms
      POSTGRES_PASSWORD: ${TMS_DB_PASSWORD}
      POSTGRES_DB: opentms
    volumes:
      - opentms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentms -d opentms"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tmsminioadmin
      MINIO_ROOT_PASSWORD: ${TMS_MINIO_ROOT_PASSWORD}
    volumes:
      - opentms_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: tmsminioadmin
      MINIO_ROOT_PASSWORD: ${TMS_MINIO_ROOT_PASSWORD}
      TMS_S3_SECRET: ${TMS_S3_SECRET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done
        mc mb --ignore-existing local/open-tms
        mc admin user add local opentms-storage "$$TMS_S3_SECRET" || true
        mc admin policy attach local readwrite --user opentms-storage || true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://opentms:${TMS_DB_PASSWORD}@database:5432/opentms?schema=public&connection_limit=10
      PUBLIC_URL: https://tms.charterconnect.online
      CORS_ORIGINS: https://tms.charterconnect.online
      JWT_SECRET: ${TMS_JWT_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${TMS_CREDENTIALS_ENCRYPTION_KEY}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: open-tms
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: opentms-storage
      S3_SECRET_ACCESS_KEY: ${TMS_S3_SECRET}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: https://api-tms.charterconnect.online

volumes:
  opentms_postgres_data:
  opentms_minio_data:
